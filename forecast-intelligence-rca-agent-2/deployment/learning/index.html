<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forecast investigation lab</title>
<style>body{font:18px system-ui;max-width:850px;margin:3rem auto;padding:1rem;background:#f4f6fa;color:#172235}textarea,button{font:inherit;padding:12px}textarea{width:95%}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:12px}button{margin-top:12px;background:#185baf;color:white;border:0;border-radius:6px}</style>
<h1>Forecast investigation lab</h1><p>Synthetic supply-chain data · No model calls · Entra sign-in</p><p>Try: Analyze forecast performance for P0001 in North. Then: What about revenue?</p>
<form id="form"><textarea id="message" required maxlength="2000" aria-label="Investigation question">Analyze forecast performance for P0001 in North.</textarea><br><button id="send">Investigate</button></form><pre id="result" role="status">Your investigation will appear here.</pre>
<script>
const key='forecast-lab-session';let session=localStorage.getItem(key)||crypto.randomUUID();localStorage.setItem(key,session);
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();const button=document.querySelector('#send');button.disabled=true;const output=document.querySelector('#result');output.textContent='Investigating…';try{const response=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,request_id:crypto.randomUUID(),message:document.querySelector('#message').value})});const data=await response.json();output.textContent=JSON.stringify(data,null,2);}catch(error){output.textContent='Request failed. Check your sign-in and network. A retry creates a new request; do not repeat a what-if until you check the case.';}finally{button.disabled=false;}};
</script></html>
