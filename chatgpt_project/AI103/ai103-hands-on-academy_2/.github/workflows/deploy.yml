# Purpose: Deploy the learning API with federated Azure identity
# Learn: Trace test, package, Azure login, deployment and health-check stages.
# Run: Manually dispatch only after azure_execution/ci_cd/README.md setup. Creates/updates a live App Service deployment; runs in GitHub Actions.

name: manual-learning-deployment
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_offline.py
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python scripts/package_deployment.py
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: outputs/app-deploy.zip
      - name: Health smoke check
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: curl --fail --retry 5 --retry-delay 10 "https://${APP_NAME}.azurewebsites.net/health"
